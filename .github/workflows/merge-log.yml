# Thin caller — merge-provenance ledger (arbor-dotfiles#257).
# All logic lives in the reusable workflow:
#   GundysShrubberies/claude-workflows/.github/workflows/merge-log.yml@v1
# Reads the merged PR's `merged-by:worker|merger|bypass` label to record which
# path merged it — bot and operator share one GitHub login, so the label is
# the only machine-readable signal of who actually merged.
#
# Runner dependency: the job below targets the fleet's self-hosted runner pool
# (ARBOR_RUNNER_LABEL, X64 fallback), and the reusable workflow shells out to
# `gh` there — confirm `gh` resolves on the self-hosted runner before
# declaring adoption complete in a newly-adopted repo (arbor#183 tracks this
# gap fleet-wide; it is not something this caller or /adopt-gates can verify
# from a laptop).

name: Merge log

on:
  pull_request:
    types: [closed]

jobs:
  merge-log:
    if: github.event.pull_request.merged == true
    # The repo default GITHUB_TOKEN is read-only; a reusable workflow is capped
    # by its caller — so grant the scopes the reusable needs here, or the token
    # it receives can't read the merged PR's labels.
    permissions:
      contents: read
      pull-requests: read
    uses: GundysShrubberies/claude-workflows/.github/workflows/merge-log.yml@v1
    # Public repo → GitHub-hosted runner, never self-hosted (operator decision 2026-09-28).
    with:
      runner-label: '"ubuntu-latest"'
    secrets:
      # Required by the reusable — it writes the ledger entry to the foreign
      # GundysShrubberies/arbor-ledger repo, which the built-in GITHUB_TOKEN
      # cannot do cross-repo.
      ARBOR_ORG_PAT: ${{ secrets.ARBOR_ORG_PAT }}
      # Optional — unset means the reusable's Discord step silently no-ops.
      ARBOR_DISCORD_WEBHOOK_REVIEW: ${{ secrets.ARBOR_DISCORD_WEBHOOK_REVIEW }}
